<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="../">
<title>Missions mer 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Prototype hors du jeu : missions 2 à 4 de la mer 1 (phare, épave, port), choisies par ?m=m2, m3 ou m4. La page reprend le jeu tel quel (index.html et js/),
     avec une retouche faite ici en mémoire, sans toucher aux fichiers du jeu : le but dessiné au bout de la mer (bouée, phare, épave ou port),
     et les données de outils/proto/mers.js (outils/proto/missions.js). La sauvegarde du jeu n'est pas modifiée. -->
<script>
'use strict';
(async () => {
  const get = async (u) => { const r = await fetch(u, { cache: 'no-cache' }); return r.text(); };
  // Corps de la page du jeu (sans ses scripts)
  const html = await get('index.html');
  document.body.insertAdjacentHTML('afterbegin', html.slice(html.indexOf('<body>') + 6, html.indexOf('<' + '!-- Fichiers communs')));
  const PATCH = {
    'js/partie.js': [[/COMMANDS\.DEF\.seq/, '(COMMANDS.DEF || { seq: [] }).seq']], // ordre Protéger pas encore appris
    'js/rendu.js': [
      [/C\(lit \? mix\('#4a4a52', '#ffd447', lit\) : '#4a4a52'\);[^\n]*\n[^\n]*cx\.fillRect\(fx - 30 \+ i \* 24[^\n]*\n/, 'if (window.drawGoal) drawGoal(fx, lit);\n'],
    ],
  };
  const scripts = [...html.matchAll(new RegExp('<' + 'script src="([^"]+)"><' + '/script>', 'g'))].map((m) => m[1]).concat(['outils/proto/mers.js', 'outils/proto/missions.js', 'outils/proto/boucle.js']);
  for (const src of scripts) {
    const s = document.createElement('script');
    if (PATCH[src]) {
      let code = await get(src);
      for (const [a, b] of PATCH[src]) { if (!a.test(code)) console.warn('Retouche introuvable dans ' + src + ' : ' + a); code = code.replace(a, b); }
      s.textContent = code;
      document.body.appendChild(s);
    } else await new Promise((ok) => { s.src = src; s.onload = ok; s.onerror = ok; document.body.appendChild(s); });
  }
})().catch((e) => { console.error('Prototype : ' + e.message); document.body.insertAdjacentText('afterbegin', 'Erreur de chargement : ' + e.message); });
</script>
</body>
</html>
