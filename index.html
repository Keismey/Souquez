<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13302b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Souquez !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Souquez ! (ex-Kôa !) : thème navire de guerre, formes simples en attendant la DA. Mise en page paysage : la scène occupe tout l'écran, la piste des 4 temps en haut au centre, deux pads sous chaque pouce dans les coins bas. Graphismes provisoires en attendant la direction artistique. */
:root{
  --bg:#13302b; --panel:#1f4640; --panel-2:#2b5a52; --paper:#f8eed6; --muted:#b9c9bd; --ink:#2a2118;
  --boum:#e0613d; --tak:#e8a33a; --ding:#33a7c8; --chh:#86b83f;
  --perfect:#ffd447; --good:#a6e57f; --miss:#a39a90;
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.iconbtn{width:48px;height:48px;border-radius:14px;border:0;background:rgba(19,48,43,.72);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.iconbtn:focus-visible,.btn:focus-visible,.pad:focus-visible{outline:3px solid var(--perfect);outline-offset:2px}
.phase{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--paper);text-shadow:0 2px 6px rgba(0,0,0,.7)}
.phase.go{color:var(--perfect)}
.combo{min-width:48px;height:48px;padding:0 10px;border-radius:14px;background:rgba(19,48,43,.72);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.combo small{display:block;font-family:var(--body);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--paper);background:rgba(19,48,43,.8);padding:6px 18px;border-radius:16px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.fail{color:var(--miss)}
#track{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 260px));display:flex;align-items:center;gap:8px}
.slots{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.slot{height:40px;border-radius:12px;background:rgba(19,48,43,.78);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.8rem;position:relative;transition:transform .08s}
.slot.own{box-shadow:inset 0 0 0 3px var(--paper),0 0 14px rgba(255,212,71,.55);transform:scale(1.06)}
.slot.beat{animation:beat .28s ease-out}
#beatFrame{position:absolute;inset:0;pointer-events:none;border-radius:0}
#beatFrame.on{animation:bframe .32s ease-out}
@keyframes bframe{0%{box-shadow:inset 0 0 0 9px rgba(255,248,230,.85)}100%{box-shadow:inset 0 0 0 0 rgba(255,248,230,0)}}
@keyframes beat{0%{filter:brightness(1.9)}100%{filter:brightness(1)}}
.slot.listen{background:rgba(19,48,43,.45);color:var(--muted)}
.slot .j{position:absolute;top:-8px;right:-4px;font-size:.6rem;padding:1px 5px;border-radius:6px;background:var(--ink)}
.j.p{color:var(--perfect)}.j.g{color:var(--good)}.j.e,.j.l{color:#ffb27a}.j.x{color:var(--miss)}
.bookbtn{height:40px;padding:0 12px;border-radius:12px;border:0;background:rgba(43,90,82,.9);color:var(--paper);font-family:var(--body);font-weight:800;cursor:pointer}
#hint{position:absolute;top:112px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 260px));min-height:1.3em;text-align:center;font-size:.85rem;font-weight:800;color:var(--paper);text-shadow:0 2px 6px rgba(0,0,0,.8)}
#pads{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.cluster{display:flex;align-items:flex-end;gap:12px;pointer-events:auto;touch-action:none}
.pad{width:min(19vh,104px);height:min(19vh,104px);min-width:64px;min-height:64px;border:0;border-radius:24px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 4px 14px rgba(0,0,0,.25);transition:transform .06s,filter .06s}
.pad.inner{margin-bottom:min(10vh,48px)}
.pad.hit{transform:scale(.93);filter:brightness(1.25)}
.pad .glyph{width:26px;height:26px}
.pad[data-pad=BOUM]{background:var(--boum)}.pad[data-pad=TAK]{background:var(--tak)}.pad[data-pad=DING]{background:var(--ding)}.pad[data-pad=CHH]{background:var(--chh)}
.rotate{display:none;position:absolute;inset:0;z-index:20;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.rotate b{font-family:var(--display);font-size:1.6rem}
@media (orientation:portrait) and (max-width:700px){.rotate{display:flex}}
.overlay{position:absolute;inset:0;background:rgba(10,28,25,.9);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));text-align:center;z-index:5;overflow-y:auto}
.overlay h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,14vh,4.4rem);line-height:1;margin:0;color:var(--paper);text-wrap:balance}
.overlay h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0}
.overlay p{margin:0;max-width:34ch;line-height:1.45;color:var(--muted)}
.btn{min-width:220px;min-height:52px;border-radius:16px;border:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.15rem;cursor:pointer;padding:0 18px}
.btn.alt{background:var(--panel-2);color:var(--paper)}
.ver{font-size:.75rem;color:var(--muted);margin-top:8px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;display:block}
.book{display:grid;gap:10px;width:100%;max-width:340px}
.cmd{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.cmd b{font-family:var(--display);font-size:1.05rem}
.cmd span{display:block;font-size:.8rem;color:var(--muted)}
.seq{display:flex;gap:5px}
.seq i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.7rem;color:#fff}
.seq i.rest{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--panel-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;width:100%;max-width:640px;text-align:left}
.titlewrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 48px}
.titlewrap .col{display:flex;flex-direction:column;align-items:center;gap:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-radius:14px;padding:10px 14px;min-height:48px}
.row label{font-weight:800}
.row input[type=range]{width:140px;accent-color:var(--perfect)}
.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--perfect)}
.row select{font:inherit;font-weight:800;background:var(--panel-2);color:var(--paper);border:0;border-radius:10px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
.stats div{background:var(--panel);border-radius:12px;padding:10px 4px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--display);font-size:1.4rem}
.stats span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.calpad{width:min(36vh,200px);height:min(36vh,200px);border-radius:50%;border:0;background:var(--ding);color:#fff;font-family:var(--display);font-weight:800;font-size:1.4rem;touch-action:none;box-shadow:inset 0 -8px 0 rgba(0,0,0,.22);transition:transform .06s}
.calpad.hit{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.pad,.slot,.banner,.calpad{transition:none}.slot.beat{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
      <div class="phase" id="phase"></div>
      <div class="combo" id="combo"><div><span id="comboN">0</span><small data-t="combo"></small></div></div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="beatFrame"></div>
  </div>
  <div id="track">
    <div class="slots" id="slots"></div>
    <button class="bookbtn" id="bookBtn" data-t="book"></button>
  </div>
  <div id="hint"></div>
  <div id="pads"></div>

  <div class="overlay" id="ovTitle">
    <div class="titlewrap">
      <div class="col">
        <div class="dots" aria-hidden="true"><i style="background:var(--boum)"></i><i style="background:var(--tak)"></i><i style="background:var(--ding)"></i><i style="background:var(--chh)"></i></div>
        <h1>Souquez !</h1>
        <p data-t="pitch"></p>
      </div>
      <div class="col">
        <button class="btn" id="playBtn" data-t="play"></button>
        <button class="btn alt" id="calBtn" data-t="calibrate"></button>
        <button class="btn alt" id="optBtn1" data-t="options"></button>
        <button class="btn alt" id="installBtn" data-t="install" hidden></button>
        <div class="ver" id="ver"></div>
      </div>
    </div>
  </div>
  <div class="rotate"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="8" width="24" height="44" rx="5" fill="none" stroke="#f8eed6" stroke-width="4"/><path d="M10 44 A24 24 0 0 0 30 58" fill="none" stroke="#ffd447" stroke-width="4" stroke-linecap="round"/><path d="M24 56 L31 59 L28 51" fill="none" stroke="#ffd447" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><b data-t="rotate"></b><p data-t="rotateHelp" style="margin:0;color:var(--muted);max-width:30ch"></p></div>

  <div class="overlay" id="ovBook" hidden>
    <h2 data-t="book"></h2>
    <p data-t="bookHelp"></p>
    <div class="book" id="bookList"></div>
    <button class="btn" id="bookClose" data-t="close"></button>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <h2 data-t="paused"></h2>
    <div class="btnrow">
    <button class="btn" id="resumeBtn" data-t="resume"></button>
    <button class="btn alt" id="optBtn2" data-t="options"></button>
    <button class="btn alt" id="restartBtn" data-t="restart"></button>
    <button class="btn alt" id="titleBtn" data-t="toTitle"></button>
    </div>
  </div>

  <div class="overlay" id="ovOpts" hidden>
    <h2 data-t="options"></h2>
    <div class="opts">
      <div class="row"><label for="oMusic" data-t="music"></label><input type="range" id="oMusic" min="0" max="100"></div>
      <div class="row"><label for="oSfx" data-t="sfx"></label><input type="range" id="oSfx" min="0" max="100"></div>
      <div class="row"><label for="oVib" data-t="vibration"></label><input type="checkbox" id="oVib"></div>
      <div class="row"><label for="oLefty" data-t="lefty"></label><input type="checkbox" id="oLefty"></div>
      <div class="row"><label for="oAssist" data-t="assist"></label><input type="checkbox" id="oAssist"></div>
      <div class="row"><label for="oFrame" data-t="frame"></label><input type="checkbox" id="oFrame"></div>
      <div class="row"><label for="oTick" data-t="tickOpt"></label><input type="checkbox" id="oTick"></div>
      <div class="row"><label for="oVoices" data-t="voicesOpt"></label><input type="checkbox" id="oVoices"></div>
      <div class="row"><label for="oLang" data-t="language"></label><select id="oLang"><option value="fr">Français</option><option value="en">English</option></select></div>
      <div class="row"><label data-t="latency"></label><span id="oLat"></span></div>
    </div>
    <div class="btnrow">
    <button class="btn alt" id="recalBtn" data-t="calibrate"></button>
    <button class="btn" id="optClose" data-t="close"></button>
    </div>
    <div class="ver" data-t="credits"></div>
  </div>

  <div class="overlay" id="ovWin" hidden>
    <h2 data-t="won"></h2>
    <p data-t="wonText"></p>
    <div class="stats">
      <div><b id="sP">0</b><span data-t="perfect"></span></div>
      <div><b id="sG">0</b><span data-t="good"></span></div>
      <div><b id="sM">0</b><span data-t="miss"></span></div>
      <div><b id="sC">0</b><span data-t="bestCombo"></span></div>
    </div>
    <button class="btn" id="againBtn" data-t="again"></button>
    <button class="btn alt" id="titleBtn2" data-t="toTitle"></button>
  </div>
</div>

<script>
(() => {
'use strict';
const VERSION = '0.7.4';
const SAVE_KEY = 'koa.save';

// ---------- Textes (FR / EN) ----------
const STR = {
  fr: {
    pitch: "Tu es le capitaine d'un cuirassé. Bats les rythmes sur le tambour de bord : ton équipage les traduit en manœuvres.",
    play: 'Jouer', calibrate: 'Calibrer le son', options: 'Options', close: 'Fermer', combo: 'combo',
    book: 'Carnet', bookHelp: "Tape une commande quand tu veux, en rythme : ton équipage la répète en l'exécutant. Enchaîne la suivante juste après sa réponse pour faire monter le combo. Toutes les commandes font 4 notes.", frame: 'Cadre qui pulse', install: 'Installer le jeu', tickOpt: 'Tic du tempo', voicesOpt: 'Voix de l’équipage',
    paused: 'Pause', resume: 'Reprendre', restart: 'Recommencer', toTitle: 'Écran titre',
    music: 'Musique', sfx: 'Bruitages', vibration: 'Vibrations', lefty: 'Mode gaucher', assist: 'Mode assisté', language: 'Langue', latency: 'Décalage audio',
    credits: 'v' + VERSION + ' · Keismey Studio · Conception et code : Claude',
    tap: 'Tape !', validate: 'Valider', retry: 'Recommencer',
    calTitle: 'Calibrage', calGo: 'Tape n’importe quel pad sur chaque clic, quand la case s’allume.',
    calDone: (ms) => 'Son réglé (' + ms + ' ms)',
    calFail: 'Pas assez de tapes, on recommence',
    failHint: 'Raté : une touche ou un temps ne correspond pas. Regarde le Carnet.',
    early: 'Tôt', late: 'Tard', double: 'Doublé',
    ready: 'Prêt…', yourTurn: 'À toi !', listen: 'L’équipage répond', soon: 'À toi dans',
    rotate: 'Tourne ton téléphone', rotateHelp: 'Souquez ! se joue en paysage, un pouce de chaque côté.',
    listenHint: 'Attends la fin de la réponse, puis enchaîne.', chainLost: 'Combo perdu : enchaîne juste après la réponse.',
    startHint: 'Ouvre le Carnet pour voir les commandes.',
    perfect: 'Parfait', good: 'Bien', miss: 'Décalés', bestCombo: 'combo max',
    cmdADV: 'Avancer', cmdADVd: 'Le navire avance', cmdATK: 'Attaquer', cmdATKd: 'Bordée de canons',
    cmdDEF: 'Protéger', cmdDEFd: 'Blindage : dégâts très réduits', cmdHEAL: 'Soigner', cmdHEALd: 'Réparations de la coque',
    fail: 'Hésitation…', tooFar: 'Trop loin ! Avance d’abord.',
    incoming: 'Attaque en approche : protège-toi !', blocked: 'Bloqué !', hit: 'Touché !', sunk: 'Coque à zéro : retour au port',
    won: 'Mer libérée !', wonText: 'Le fort ennemi est tombé. Ton équipage fête la victoire.', again: 'Rejouer',
  },
  en: {
    pitch: 'You are the captain of a battleship. Beat rhythms on the ship’s drum: your crew turns them into manoeuvres.',
    play: 'Play', calibrate: 'Calibrate sound', options: 'Options', close: 'Close', combo: 'combo',
    book: 'Notebook', bookHelp: 'Tap a command whenever you want, on the beat: your crew repeats it while performing it. Chain the next one right after their answer to raise the combo. Every command has 4 notes.', frame: 'Pulsing frame', install: 'Install the game', tickOpt: 'Beat tick', voicesOpt: 'Crew voices',
    paused: 'Paused', resume: 'Resume', restart: 'Restart', toTitle: 'Title screen',
    music: 'Music', sfx: 'Sound effects', vibration: 'Vibration', lefty: 'Left-handed mode', assist: 'Assist mode', language: 'Language', latency: 'Audio offset',
    credits: 'v' + VERSION + ' · Keismey Studio · Design and code: Claude',
    tap: 'Tap!', validate: 'Confirm', retry: 'Try again',
    calTitle: 'Calibration', calGo: 'Tap any pad on every click, when the box lights up.',
    calDone: (ms) => 'Sound set (' + ms + ' ms)',
    calFail: 'Not enough taps, let’s try again',
    failHint: 'Missed: a pad or a beat doesn’t match. Check the Notebook.',
    early: 'Early', late: 'Late', double: 'Double',
    ready: 'Ready…', yourTurn: 'Your turn!', listen: 'Your crew answers', soon: 'Your turn in',
    rotate: 'Turn your phone', rotateHelp: 'Souquez! is played in landscape, one thumb on each side.',
    listenHint: 'Wait for the answer to end, then chain.', chainLost: 'Combo lost: chain right after the answer.',
    startHint: 'Open the Notebook to see the commands.',
    perfect: 'Perfect', good: 'Good', miss: 'Off-beat', bestCombo: 'best combo',
    cmdADV: 'Advance', cmdADVd: 'The ship moves forward', cmdATK: 'Attack', cmdATKd: 'Cannon broadside',
    cmdDEF: 'Protect', cmdDEFd: 'Armour: much less damage taken', cmdHEAL: 'Heal', cmdHEALd: 'Hull repairs',
    fail: 'Hesitation…', tooFar: 'Too far! Move closer first.',
    incoming: 'Attack incoming: protect yourself!', blocked: 'Blocked!', hit: 'Hit!', sunk: 'Hull at zero: back to port',
    won: 'Sea freed!', wonText: 'The enemy fort has fallen. Your crew celebrates.', again: 'Play again',
  }
};

// ---------- Données de jeu ----------
const PADS = { BOUM: '#e0613d', TAK: '#e8a33a', DING: '#33a7c8', CHH: '#86b83f' };
const COMMANDS = {
  // Chaque ordre commence à droite, sur BOUM
  ADV:  { seq: ['BOUM', 'TAK', 'BOUM', 'TAK'] },
  ATK:  { seq: ['BOUM', 'BOUM', 'TAK', 'TAK'] },
  // DING est rare : il ne sert qu'à conclure les ordres de soutien
  DEF:  { seq: ['BOUM', 'BOUM', 'BOUM', 'DING'] },
  HEAL: { seq: ['BOUM', 'BOUM', 'TAK', 'DING'] },
};
// 3 tambours au départ (TAK + DING à gauche, BOUM seul à droite et le plus utilisé) ; CHH arrivera avec les ordres secondaires
const PADS_ON = ['BOUM', 'DING', 'TAK'];
const BPM = 102, SPB = 60 / BPM; // calé sur la musique (102 BPM mesurés)
const WIN = { p: 0.08, g: 0.16 };
// Monde en unités « écran de 400 de haut ». La mer est à SEA.
const SEA = 228, STOP = 250, RANGE = 470, AGGRO = 540;
const LEVEL = {
  monsters: [{ x: 900, hp: 4, size: 1 }, { x: 1550, hp: 6, size: 1.2 }, { x: 2300, hp: 10, size: 1.7, boss: true }],
  portX: 2950, hull: 10,
};

// ---------- Sauvegarde ----------
function defLang() {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'fr' || q === 'en') return q; } catch (_) {}
  return (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
}
function loadSave() {
  const base = { v: 1, lang: defLang(), music: 70, sfx: 90, vib: true, lefty: false, assist: false, frame: false, tick: false, voices: true, offset: null, best: 0 };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return Object.assign(base, s); }
  } catch (_) {}
  return base;
}
const save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }
const t = (k) => (STR[save.lang] || STR.fr)[k] ?? STR.fr[k] ?? k;

// ---------- Audio ----------
let ctx = null, musicBus, sfxBus, noiseBuf;
function initAudio() {
  if (ctx) { if (ctx.state === 'suspended' && !(G && G.paused)) ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: 'interactive' });
  musicBus = ctx.createGain(); sfxBus = ctx.createGain();
  musicBus.connect(ctx.destination);
  // Tambours : compresseur + gain de rattrapage pour plus d'impact, et une petite salle (réverbération courte)
  const comp = ctx.createDynamicsCompressor();

  const camT = sh.x - VW * 0.36;
  if (G) { if (G.cam === null) G.cam = camT; G.cam = lerp(G.cam, camT, 0.08); }
  const cam = G ? G.cam : camT;
  const shx = G ? (Math.random() - 0.5) * 6 * G.shake : 0;
  cx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  // Ciel de crépuscule, plus chaud quand le rythme tient
  const sky = cx.createLinearGradient(0, 0, 0, SEA);
  sky.addColorStop(0, mix('#1b2a3d', '#2c3550', heat)); sky.addColorStop(1, mix('#8f6a5a', '#e0955a', heat));
  C(sky); cx.fillRect(0, 0, VW, 400);
  C('rgba(255,214,150,' + (0.35 + heat * 0.4) + ')'); cx.beginPath(); cx.arc(VW * 0.72 - cam * 0.03, SEA - 30, 34, 0, 7); cx.fill();
  for (let i = 0; i < 6; i++) { const x = ((i * 260 - cam * 0.15 + tAmb * 4) % (VW + 300) + VW + 300) % (VW + 300) - 150; C('rgba(40,44,60,.45)'); cx.beginPath(); cx.ellipse(x, 60 + (i % 3) * 40, 120, 18, 0, 0, 7); cx.fill(); }
  // Mer lointaine
  C('#24425a'); cx.fillRect(0, SEA - 4, VW, 400);
  cx.save(); cx.translate(-cam + shx, 0);
  // Fort ennemi au bout de la mer
  const fx = LEVEL.portX, lit = G ? G.totemLit : 0;
  C(lit ? mix('#4a4a52', '#ffd447', lit) : '#4a4a52'); cx.fillRect(fx - 40, SEA - 120, 80, 120); cx.fillRect(fx - 56, SEA - 130, 112, 14);
  C('#2a2a30'); for (let i = 0; i < 3; i++) cx.fillRect(fx - 30 + i * 24, SEA - 100, 10, 16);
  if (G) for (const e of G.mons) drawMonster(e);
  const listening = G && G.mode !== 'calib' && inResp(G.curBeat);
  drawShip(sh, G && guarded(G.curBeat), pulse, listening);
  // Boulets et projectiles
  if (G) for (const s of G.shots) {
    const k = Math.min(1, s.t / s.dur), x = lerp(s.x0, s.x1, k), y = lerp(s.y0, s.y1, k) - Math.sin(k * Math.PI) * (s.mon ? 50 : 60);
    C(s.mon ? '#9fe0ff' : '#1d1d22'); cx.beginPath(); cx.arc(x, y, s.mon ? 8 : 5, 0, 7); cx.fill();
  }
  if (G) for (const p of G.puffs) { const k = p.t / 0.6; C(p.blue ? 'rgba(140,220,255,' + (1 - k) + ')' : 'rgba(255,190,110,' + (1 - k) * 0.9 + ')'); cx.beginPath(); cx.arc(p.x, p.y, (p.big ? 22 : 12) + k * 30, 0, 7); cx.fill(); }
  if (G) for (const f of G.fx) { C('rgba(140,240,140,' + (1 - f.t / 0.9) + ')'); const y = f.y - f.t * 40; cx.fillRect(f.x - 2, y - 7, 4, 14); cx.fillRect(f.x - 7, y - 2, 14, 4); }
  // Vagues de premier plan
  C('rgba(28,62,86,.88)'); cx.beginPath(); cx.moveTo(cam - 50, 400);
  for (let x = Math.floor((cam - 50) / 20) * 20; x <= cam + VW + 50; x += 20) cx.lineTo(x, SEA + 36 + Math.sin(x * 0.05 + tAmb * 2) * 4);
  cx.lineTo(cam + VW + 50, 400); cx.fill();
  cx.strokeStyle = 'rgba(200,230,240,.35)'; cx.lineWidth = 2; cx.beginPath();
  for (let x = Math.floor((cam - 50) / 20) * 20; x <= cam + VW + 50; x += 20) cx.lineTo(x, SEA + 36 + Math.sin(x * 0.05 + tAmb * 2) * 4);
  cx.stroke();
  cx.restore();
  // Coque restante, dans le coin haut gauche sous la pause
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const f = sh.hp / LEVEL.hull, bx0 = 16, by0 = 70;
  C('rgba(10,20,24,.7)'); rr(bx0, by0, 128, 14, 7); cx.fill();
  C(f > 0.5 ? '#7fd36b' : f > 0.25 ? '#f0b545' : '#e0573d'); rr(bx0 + 3, by0 + 3, 122 * f, 8, 4); cx.fill();
}

// ---------- Démarrage ----------
applyTexts(); renderSlots(); refreshOpts(); openOverlay('ovTitle');
requestAnimationFrame(frame);
})();
</script>
